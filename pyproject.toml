[tool.black]
line-length = 88
target-version = ["py312"]
include = "\\.pyi?$"
extend-exclude = '''
/(\
    \.git
  | \.venv
  | __pycache__
  | \.pytest_cache
)/
'''

[tool.pylint.main]
py-version = "3.12"
fail-under = 9.5
jobs = 1
recursive = true
ignore-paths = [
  ".*/\\.venv/.*",
  ".*/__pycache__/.*",
  ".*/\\.pytest_cache/.*",
]

[tool.pylint.messages_control]
enable = ["all"]
disable = [
  "raw-checker-failed",
  "bad-inline-option",
  "locally-disabled",
  "file-ignored",
  "suppressed-message",
  "useless-suppression",
  "deprecated-pragma",
  "use-symbolic-message-instead",
]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.design]
max-args = 5
max-attributes = 7
max-bool-expr = 4
max-branches = 10
max-locals = 10
max-parents = 5
max-public-methods = 20
max-returns = 4
max-statements = 35
min-public-methods = 1

[tool.pylint.classes]
valid-classmethod-first-arg = ["cls"]
valid-metaclass-classmethod-first-arg = ["mcs"]

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "e", "_"]

[tool.pylint.reports]
score = true

[tool.pylint.logging]
logging-format-style = "new"
